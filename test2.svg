# Retry vectorization with a fix: svgwrite doesn't accept 'rgba(...)' strings for fill in this environment.
# We'll convert the color to hex and set opacity via 'fill_opacity' when needed.
from PIL import Image, ImageOps
import numpy as np
import os
out_svg_path = "/mnt/data/good_vibes.svg"
img_path = "/mnt/data/WhatsApp Image 2026-01-22 at 15.11.14.jpeg"

def fallback_embed_png():
    im = Image.open(img_path).convert("RGBA")
    w,h = im.size
    png_path = "/mnt/data/_good_vibes_embedded.png"
    im.save(png_path)
    svg_content = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="{h}" viewBox="0 0 {w} {h}">
  <image href="{os.path.basename(png_path)}" width="{w}" height="{h}" />
</svg>'''
    with open(out_svg_path, "w") as f:
        f.write(svg_content)
    return False, png_path

try:
    import cv2, svgwrite, math
    use_vector = True
except Exception as e:
    use_vector = False
    cv2 = None
    svgwrite = None

if use_vector:
    orig = cv2.imread(img_path, cv2.IMREAD_UNCHANGED)
    if orig is None:
        ok, png_path = fallback_embed_png()
        raise SystemExit("Image not found; embedded fallback created.")

    h0, w0 = orig.shape[:2]
    max_dim = 1200
    scale = 1.0
    if max(h0,w0) > max_dim:
        scale = max_dim / max(h0,w0)
        orig = cv2.resize(orig, (int(w0*scale), int(h0*scale)), interpolation=cv2.INTER_AREA)
    h,w = orig.shape[:2]
    if orig.shape[2] == 3:
        img_rgba = cv2.cvtColor(orig, cv2.COLOR_BGR2BGRA)
    else:
        img_rgba = orig.copy()

    gray = cv2.cvtColor(img_rgba, cv2.COLOR_BGR2GRAY)
    thr = cv2.adaptiveThreshold(gray,255,cv2.ADAPTIVE_THRESH_GAUSSIAN_C,
                                cv2.THRESH_BINARY_INV,11,8)
    kernel = cv2.getStructuringElement(cv2.MORPH_ELLIPSE,(3,3))
    clean = cv2.morphologyEx(thr, cv2.MORPH_OPEN, kernel, iterations=1)
    clean = cv2.morphologyEx(clean, cv2.MORPH_CLOSE, kernel, iterations=1)
    contours, hierarchy = cv2.findContours(clean, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_TC89_KCOS)
    areas = [cv2.contourArea(c) for c in contours]
    if len(areas) == 0:
        ok, png_path = fallback_embed_png()
        raise SystemExit("No contours; embedded fallback created.")

    median_area = np.median(areas)
    big_contours = []
    for c,a in zip(contours,areas):
        if a > max(0.01*median_area, 200):
            big_contours.append((c,a))
    big_contours = sorted(big_contours, key=lambda x: -x[1])
    big_contours = [c for c,a in big_contours]

    def contour_centroid_color(contour):
        M = cv2.moments(contour)
        if M["m00"] == 0:
            x,y = contour[0][0]
        else:
            x = int(M["m10"]/M["m00"])
            y = int(M["m01"]/M["m00"])
        x = np.clip(x,0,w-1); y = np.clip(y,0,h-1)
        b,g,r,a = img_rgba[y,x]
        return (int(r),int(g),int(b),int(a))

    dwg = svgwrite.Drawing(out_svg_path, size=(w,h), viewBox=f"0 0 {w} {h}")
    bg_col = tuple(int(c) for c in img_rgba[0,0][:3])
    bg_hex = '#%02x%02x%02x' % (bg_col[2],bg_col[1],bg_col[0])
    dwg.add(dwg.rect(insert=(0,0), size=(w,h), fill=bg_hex))

    for contour in big_contours:
        peri = cv2.arcLength(contour, True)
        eps = max(0.002*peri, 2.0)
        approx = cv2.approxPolyDP(contour, eps, True)
        pts = [(int(pt[0][0]), int(pt[0][1])) for pt in approx]
        if len(pts) < 3:
            continue
        path_d = "M " + " L ".join(f"{x},{y}" for x,y in pts) + " Z"
        r,g,b,a = contour_centroid_color(contour)
        hex_col = '#%02x%02x%02x' % (r,g,b)
        opacity = a/255.0 if a is not None else 1.0
        dwg.add(dwg.path(d=path_d, fill=hex_col, fill_opacity=opacity, stroke='none'))
    dwg.save()
    raster_copy = "/mnt/data/good_vibes_raster_copy.png"
    cv2.imwrite(raster_copy, orig)
    print("SVG vectorization attempted. File saved to:", out_svg_path)
    print("Raster copy saved to:", raster_copy)
else:
    ok, png_path = fallback_embed_png()
    print("Vector libraries unavailable; created SVG embedding original PNG at:", out_svg_path)

if os.path.exists(out_svg_path):
    print("\nDone. Output SVG path:", out_svg_path)
else:
    print("\nFailed to create SVG.")

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'interview-backend'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - app:3000
  - job_name: 'interview-backend-scaled'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - app1:3000
          - app2:3000
          - app3:3000
